{% load static i18n pms %}<!DOCTYPE html>
<html lang="es" class="h-full">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% trans "Cuenta bloqueada" %}</title>
  <link rel="stylesheet" href="{% static 'css/app.css' %}">
</head>
<body class="flex h-full items-center justify-center p-6">
  <div class="card max-w-md p-8 text-center">
    <span class="mx-auto mb-4 flex h-12 w-12 items-center justify-center rounded-full bg-state-blocked/10 text-state-blocked">{% icon "lock" "w-6 h-6" %}</span>
    <h1 class="font-display text-2xl font-semibold">{% trans "Acceso bloqueado temporalmente" %}</h1>
    <p class="mt-3 text-sm text-ink-500">{% trans "Hubo demasiados intentos fallidos. Espera unos minutos o pide al administrador que desbloquee tu usuario." %}</p>
    <a href="{% url 'accounts:login' %}" class="btn-secondary mt-6">{% trans "Volver al inicio de sesión" %}</a>
  </div>
</body>
</html>
