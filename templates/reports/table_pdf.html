<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
  @page { size: a4 landscape; margin: 1.2cm; }
  body { font-family: Helvetica; font-size: 8.5pt; color: #292524; }
  h1 { color: #7a1e2c; font-size: 14pt; margin: 0 0 8px 0; }
  table { width: 100%; border-collapse: collapse; }
  th { background: #f5f5f4; text-align: left; padding: 4px; border-bottom: 1px solid #a8a29e; }
  td { padding: 4px; border-bottom: 0.5px solid #e7e5e4; }
  .muted { color: #78716c; font-size: 7.5pt; }
</style></head>
<body>
  <h1>{{ title }}</h1>
  <table><tr>{% for h in header %}<th>{{ h }}</th>{% endfor %}</tr>
    {% for row in rows %}<tr>{% for v in row %}<td>{{ v }}</td>{% endfor %}</tr>{% empty %}<tr><td colspan="{{ header|length }}">Sin datos</td></tr>{% endfor %}
  </table>
  <p class="muted">Generado {% now "d/m/Y H:i" %}</p>
</body></html>
