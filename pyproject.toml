# Este archivo solo configura herramientas (black, ruff, pytest, coverage). El sistema NO es un paquete
# instalable: las dependencias están en requirements/ y en Render se construye con ./build.sh.
[project]
name = "pms-la-sallito"
version = "0.1.0"
description = "PMS hotelero para hoteles de Urubamba, Cusco (Django)"
requires-python = ">=3.12"

[tool.poetry]
package-mode = false

[tool.black]
line-length = 110
target-version = ["py312"]
extend-exclude = "migrations"

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["migrations", "node_modules", "static"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "DJ", "S"]
ignore = ["S101", "E501", "DJ006"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S105", "S106"]
"conftest.py" = ["S105", "S106"]
"config/settings/*" = ["F405"]
"scripts/load_test.py" = ["S310"]  # solo abre la URL http(s) que se le indica (validada en main)

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py"]
addopts = "-ra --strict-markers"

[tool.coverage.run]
source = ["apps"]
omit = ["*/migrations/*", "*/tests/*"]

# RNF-MAN-02: reglas de negocio (tarifas, disponibilidad, impuestos, folio, facturación) con 80 % mínimo.
# Se mide con:  pytest --cov --cov-config=.coveragerc-business
